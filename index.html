<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Salina Operations</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      padding: 14px 16px;
      background: var(--tg-theme-secondary-bg-color, #f0f2f5);
      border-bottom: 1px solid rgba(128,128,128,0.2);
      text-align: center; font-weight: 600; font-size: 15px;
      flex-shrink: 0;
    }
    .content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .tab-panel { display: none; flex: 1; overflow-y: auto; }
    .tab-panel.active { display: flex; flex-direction: column; }

    /* CHAT */
    #chatMessages { flex: 1; overflow-y: auto; padding: 12px; }
    .msg {
      max-width: 80%; padding: 10px 14px; border-radius: 16px;
      margin-bottom: 8px; font-size: 14px; line-height: 1.4;
      word-wrap: break-word; white-space: pre-wrap;
    }
    .msg.user {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      margin-left: auto; border-bottom-right-radius: 4px;
    }
    .msg.bot {
      background: var(--tg-theme-secondary-bg-color, #f0f2f5);
      border-bottom-left-radius: 4px;
    }
    .msg.typing { opacity: 0.6; font-style: italic; }
    #chatInputBar {
      display: flex; padding: 8px; gap: 6px;
      background: var(--tg-theme-secondary-bg-color, #f0f2f5);
      border-top: 1px solid rgba(128,128,128,0.2); flex-shrink: 0;
    }
    #chatInput {
      flex: 1; padding: 10px 14px; border-radius: 20px; border: none;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      font-size: 14px; outline: none;
    }
    #sendBtn {
      padding: 10px 16px; border-radius: 20px; border: none;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      font-weight: 600; cursor: pointer; font-size: 14px;
    }

    /* DELIVERY */
    .section { padding: 12px; }
    .order-card {
      background: var(--tg-theme-secondary-bg-color, #f0f2f5);
      border-radius: 12px; padding: 12px; margin-bottom: 10px;
    }
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .order-id { font-weight: 700; font-size: 14px; }
    .status-badge { padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .status-pending { background: #ff9800; color: #fff; }
    .status-transit { background: #2196f3; color: #fff; }
    .status-delivered { background: #4caf50; color: #fff; }
    .order-info { font-size: 12px; opacity: 0.8; margin: 3px 0; }
    .order-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .status-btn {
      padding: 6px 10px; border-radius: 8px; border: none; font-size: 11px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      cursor: pointer; font-weight: 600;
    }
    .status-btn.ghost {
      background: transparent; border: 1px solid rgba(128,128,128,0.5);
      color: var(--tg-theme-text-color, #000);
    }
    .add-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: 2px dashed rgba(128,128,128,0.4);
      background: transparent; color: var(--tg-theme-text-color, #000);
      font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
    }

    /* NAV */
    .bottom-nav {
      display: flex; background: var(--tg-theme-secondary-bg-color, #f0f2f5);
      border-top: 1px solid rgba(128,128,128,0.2); padding: 6px 0; flex-shrink: 0;
    }
    .nav-item {
      flex: 1; text-align: center; padding: 6px; cursor: pointer;
      font-size: 11px; opacity: 0.5; transition: opacity 0.2s; user-select: none;
    }
    .nav-item.active { opacity: 1; color: var(--tg-theme-button-color, #2481cc); }
    .nav-item .icon { font-size: 20px; display: block; margin-bottom: 1px; }
  </style>
</head>
<body>

  <header id="appTitle">Salina Operations</header>

  <div class="content">

    <!-- TAB 1: AI CHAT -->
    <div id="chat" class="tab-panel active">
      <div id="chatMessages">
        <div class="msg bot">👋 Hello! I can help in ខ្មែរ, English, or 中文. How can I assist you today?</div>
      </div>
      <div id="chatInputBar">
        <input id="chatInput" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <!-- TAB 2: DELIVERY -->
    <div id="delivery" class="tab-panel">
      <div class="section">
        <button class="add-btn" onclick="addOrder()">+ New Delivery Order</button>
        <div id="orderList"></div>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="chat"><span class="icon">💬</span>Chat</div>
    <div class="nav-item" data-tab="delivery"><span class="icon">🚚</span>Delivery</div>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user?.first_name) {
        document.getElementById('appTitle').textContent = `Hi, ${user.first_name}`;
      }
    }

    // NAV
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        item.classList.add('active');
        document.getElementById(item.dataset.tab).classList.add('active');
        if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
      });
    });

    // ============ AI CHAT ============
    // ⚠️ REPLACE THIS with your NEW key (the one you created after deleting the exposed one)
    const GEMINI_API_KEY = 'AQ.Ab8RN6Iqf1e2jNuVw3ayi3atZUOeYhxwhGSZXb2Nj_wiHnV1VQ';

    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    let conversationHistory = [
      { role: 'user', parts: [{ text: 'You are Salina, a helpful customer service assistant for a business in Cambodia. You MUST auto-detect the customer language and ALWAYS reply in the SAME language they used. Supported languages: Khmer, English, Chinese. Be concise, friendly, and helpful. If you do not know something, offer to connect them to a human.' }] },
      { role: 'model', parts: [{ text: 'Understood. I will respond in the customer\'s language (Khmer, English, or Chinese) and assist them helpfully.' }] }
    ];

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';
      addMessage(text, 'user');
      conversationHistory.push({ role: 'user', parts: [{ text }] });

      const typingEl = addMessage('...', 'bot typing');

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-goog-api-key': GEMINI_API_KEY
            },
            body: JSON.stringify({ contents: conversationHistory })
          }
        );
        const data = await res.json();

        if (!res.ok) {
          typingEl.remove();
          const errMsg = data?.error?.message || `HTTP ${res.status}`;
          addMessage('⚠️ ' + errMsg, 'bot');
          console.error('Gemini error:', data);
          return;
        }

        typingEl.remove();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || '⚠️ No response from AI.';
        conversationHistory.push({ role: 'model', parts: [{ text: reply }] });
        addMessage(reply, 'bot');
      } catch (e) {
        typingEl.remove();
        addMessage('⚠️ Network error. Check your connection.', 'bot');
        console.error(e);
      }
    }

    function addMessage(text, type) {
      const el = document.createElement('div');
      el.className = 'msg ' + type;
      el.textContent = text;
      chatMessages.appendChild(el);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      return el;
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    // ============ DELIVERY ============
    const STORAGE_KEY = 'salina_orders';
    const orderList = document.getElementById('orderList');

    function loadOrders() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [
        { id: 'ORD-001', customer: 'Sok Dara', phone: '012 345 678', address: 'Phnom Penh, Toul Kork', status: 'pending', note: '' },
        { id: 'ORD-002', customer: 'Chen Wei', phone: '088 123 456', address: 'Siem Reap, Old Market', status: 'transit', note: 'Call before arrival' }
      ];
    }

    function saveOrders(orders) { localStorage.setItem(STORAGE_KEY, JSON.stringify(orders)); }

    function renderOrders() {
      const orders = loadOrders();
      orderList.innerHTML = '';
      if (!orders.length) {
        orderList.innerHTML = '<p style="text-align:center;opacity:0.5;padding:20px;">No delivery orders yet.</p>';
        return;
      }
      orders.forEach((order, idx) => {
        const statusLabel = { pending: '⏳ Pending', transit: '🚚 In Transit', delivered: '✅ Delivered' }[order.status];
        const statusClass = { pending: 'status-pending', transit: 'status-transit', delivered: 'status-delivered' }[order.status];
        const card = document.createElement('div');
        card.className = 'order-card';
        card.innerHTML = `
          <div class="order-header">
            <span class="order-id">${order.id}</span>
            <span class="status-badge ${statusClass}">${statusLabel}</span>
          </div>
          <div class="order-info">👤 ${order.customer} · 📞 ${order.phone}</div>
          <div class="order-info">📍 ${order.address}</div>
          ${order.note ? `<div class="order-info">📝 ${order.note}</div>` : ''}
          <div class="order-actions">
            <button class="status-btn" onclick="updateStatus(${idx}, 'pending')">Pending</button>
            <button class="status-btn" onclick="updateStatus(${idx}, 'transit')">In Transit</button>
            <button class="status-btn" onclick="updateStatus(${idx}, 'delivered')">Delivered</button>
            <button class="status-btn ghost" onclick="deleteOrder(${idx})">Delete</button>
          </div>
        `;
        orderList.appendChild(card);
      });
    }

    function addOrder() {
      const id = 'ORD-' + String(Date.now()).slice(-5);
      const customer = prompt('Customer name:');
      if (!customer) return;
      const phone = prompt('Phone number:') || '';
      const address = prompt('Delivery address:') || '';
      const note = prompt('Note (optional):') || '';
      const orders = loadOrders();
      orders.push({ id, customer, phone, address, status: 'pending', note });
      saveOrders(orders);
      renderOrders();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function updateStatus(idx, status) {
      const orders = loadOrders();
      orders[idx].status = status;
      saveOrders(orders);
      renderOrders();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }

    function deleteOrder(idx) {
      if (!confirm('Delete this order?')) return;
      const orders = loadOrders();
      orders.splice(idx, 1);
      saveOrders(orders);
      renderOrders();
    }

    renderOrders();
  </script>

</body>
</html>
